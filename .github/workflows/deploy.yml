name: Deploy to Cloudflare Workers

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Publish to Cloudflare Workers
        run: |
          # 自动将 GitHub 后台的各项变量注入到 Cloudflare 线上
          echo "${{ secrets.ADMIN }}" | npx wrangler secret put ADMIN
          echo "${{ secrets.UUID }}" | npx wrangler secret put UUID
          echo "${{ secrets.PROXYIP }}" | npx wrangler secret put PROXYIP
          echo "${{ secrets.ECH_DOH_URL }}" | npx wrangler secret put ECH_DOH_URL
          echo "${{ secrets.KEY }}" | npx wrangler secret put KEY
          
          # 执行最终部署
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          
