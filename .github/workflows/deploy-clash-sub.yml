name: Deploy Clash Sub Worker

on:
  push:
    branches: [ main, master ]
    paths:
      - 'workers/clash-sub/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Clash Sub
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci
        working-directory: workers/clash-sub

      - name: Publish to Cloudflare Workers
        run: |
          # 自动注入副 Worker 的核心变量
          echo "edb05f6d-184b-483b-ada5-a30b26a4b6e3" | npx wrangler secret put CLOUDFLARE_UUID --config wrangler.toml
          echo "888" | npx wrangler secret put SECRET_TOKEN --config wrangler.toml
          echo "666" | npx wrangler secret put PAGE_PASSWORD --config wrangler.local.toml
          
          # 执行部署
          npx wrangler deploy --config wrangler.local.toml
        working-directory: workers/clash-sub
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}